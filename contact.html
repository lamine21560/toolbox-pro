<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact – ToolBox Pro</title><meta name="description" content="Contactez l’équipe ToolBox Pro."><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>"><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head><body data-p="page"><main class="wrap" id="app"><h1>📩 Contact</h1><p>Une question, une idée d’outil ? Écrivez-nous.</p><div class="box"><label>Votre email<input id="e" type="email"></label><label>Message<textarea id="m" rows="5"></textarea></label><button class="btn" onclick="location.href=`mailto:${SITE.email}?subject=Contact ToolBox Pro&body=${encodeURIComponent(m.value+&quot;\n\n&quot;+e.value)}`">Envoyer</button></div></main></body></html>
