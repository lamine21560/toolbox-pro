<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact – ToolBox Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dk = localStorage.th ? localStorage.th == 'd' : matchMedia('(prefers-color-scheme:dark)').matches;
            document.documentElement.dataset.theme = dk ? 'dark' : 'light';
            document.body.insertAdjacentHTML('afterbegin', `<header><div class="wrap"><a class="logo" href="index.html">🛠️ ToolBox Pro</a><nav><a href="index.html">Accueil</a><a href="index.html#outils">Outils</a><a href="guides.html">Guides</a><a href="a-propos.html">À propos</a><a href="contact.html">Contact</a></nav></div></header>`);
            document.body.insertAdjacentHTML('beforeend', `<footer><a href="a-propos.html">À propos</a><a href="contact.html">Contact</a><a href="confidentialite.html">Confidentialité</a><a href="conditions.html">Conditions</a><p>© ${new Date().getFullYear()} ToolBox Pro</p></footer>`);
            document.body.insertAdjacentHTML('beforeend', `<main class="wrap"><h1>Contactez-nous</h1><p>Pour toute question ou suggestion, vous pouvez nous écrire à : <strong>contact@exemple.com</strong></p></main>`);
        });
    </script>
</body>
</html>
